buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version = '1.0.0'
group = 'dev.vibecoderqin.lunarspoof'
archivesBaseName = 'LunarSpoof-Forge-1.8.9'

sourceCompatibility = 1.8
targetCompatibility = 1.8

minecraft {
    version = '1.8.9-11.15.1.2318-1.8.9'
    runDir = 'run'
    mappings = 'stable_22'
}

repositories {
    maven { url = 'https://maven.minecraftforge.net' }
    mavenCentral()
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', '1.8.9'
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': '1.8.9'
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    manifest {
        attributes(
            'FMLCorePlugin': 'dev.vibecoderqin.lunarspoof.LunarSpoofLoadingPlugin',
            'FMLCorePluginContainsFMLMod': 'true',
            'ModSide': 'CLIENT',
            'ForceLoadAsMod': 'true',
            'Implementation-Title': 'LunarSpoof for Forge 1.8.9',
            'Implementation-Version': project.version
        )
    }
}
