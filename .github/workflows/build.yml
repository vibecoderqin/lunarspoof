name: Build LunarSpoof for Forge 1.8.9

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fetch current Lunar 1.8.9 build metadata
        shell: bash
        run: |
          if python3 scripts/fetch_lunar_version.py >> "$GITHUB_ENV"; then
            echo "Fetched Lunar build metadata."
          else
            echo "lunarVersion=v2.23.5-2642" >> "$GITHUB_ENV"
            echo "lunarGitCommit=unknown" >> "$GITHUB_ENV"
            echo "Using fallback version metadata."
          fi
      - name: Build mod
        run: bash gradlew build --no-daemon --stacktrace -PlunarVersion="${lunarVersion}" -PlunarGitCommit="${lunarGitCommit}"
      - uses: actions/upload-artifact@v4
        with:
          name: LunarSpoof-Forge-1.8.9
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
