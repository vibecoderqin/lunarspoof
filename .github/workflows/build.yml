name: Build Forge 1.8.9 mod

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Install Gradle 2.14.1
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-2.14.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-2.14.1/bin" >> "$GITHUB_PATH"
      - name: Build JAR
        run: gradle build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LunarSpoof-Forge-1.8.9
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
