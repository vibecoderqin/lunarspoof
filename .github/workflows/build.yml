name: Build LunarSpoof for Forge 1.8.9

permissions:
  contents: read

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Gradle 8.8
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.8-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.8/bin" >> "$GITHUB_PATH"
      - name: Fetch current Lunar 1.8.9 build metadata
        shell: bash
        run: |
          if python3 scripts/fetch_lunar_version.py >> "$GITHUB_ENV"; then
            echo "Fetched Lunar build metadata."
          else
            echo "lunarVersion=v2.23.7-2643" >> "$GITHUB_ENV"
            echo "lunarGitCommit=unknown" >> "$GITHUB_ENV"
            echo "Using fallback version metadata."
          fi
      - name: Format Java sources
        run: gradle spotlessApply --no-daemon -PlunarVersion="${lunarVersion}" -PlunarGitCommit="${lunarGitCommit}"
      - name: Build mod
        run: gradle build --no-daemon --stacktrace -PlunarVersion="${lunarVersion}" -PlunarGitCommit="${lunarGitCommit}"
      - uses: actions/upload-artifact@v4
        with:
          name: LunarSpoof-Forge-1.8.9
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

  release:
    # Publish v1.1.1 once from the main-branch release commit. The tag-triggered
    # run skips republishing v1.1.1; later version tags still publish normally.
    if: (startsWith(github.ref, 'refs/tags/v') && github.ref_name != 'v1.1.1') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish v1.1.1]'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LunarSpoof-Forge-1.8.9
          path: dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref == 'refs/heads/main' && 'v1.1.1' || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: LunarSpoof ${{ github.ref == 'refs/heads/main' && '1.1.1' || github.ref_name }} - Forge 1.8.9
          generate_release_notes: true
          files: dist/LunarSpoof-*-forge.jar
