name: Build LunarSpoof for Forge 1.8.9

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Gradle 8.8
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.8-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.8/bin" >> "$GITHUB_PATH"
      - name: Fetch current Lunar 1.8.9 build metadata
        shell: bash
        run: |
          if python3 scripts/fetch_lunar_version.py >> "$GITHUB_ENV"; then
            echo "Fetched Lunar build metadata."
          else
            echo "lunarVersion=v2.23.7-2643" >> "$GITHUB_ENV"
            echo "lunarGitCommit=unknown" >> "$GITHUB_ENV"
            echo "Using fallback version metadata."
          fi
      - name: Format Java sources
        run: gradle spotlessApply --no-daemon -PlunarVersion="${lunarVersion}" -PlunarGitCommit="${lunarGitCommit}"
      - name: Build mod
        run: gradle build --no-daemon --stacktrace -PlunarVersion="${lunarVersion}" -PlunarGitCommit="${lunarGitCommit}"
      - uses: actions/upload-artifact@v4
        with:
          name: LunarSpoof-Forge-1.8.9
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

  publish_release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish LunarSpoof 1.1.0 release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish prepared LunarSpoof release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH repos/vibecoderqin/lunarspoof/releases/420988527 \
            -f tag_name='v1.1.0' \
            -f target_commitish="$GITHUB_SHA" \
            -f name='LunarSpoof 1.1.0 - Forge 1.8.9' \
            -f body='LunarSpoof 1.1.0 for Minecraft 1.8.9 with Forge.

Features include the ClickGUI, client-brand options, privacy settings, and Discord Rich Presence configuration. The client command no longer requires operator permissions.

Install the JAR in your .minecraft/mods folder and run Minecraft 1.8.9 with Forge.' \
            -F draft=false \
            -F prerelease=false
